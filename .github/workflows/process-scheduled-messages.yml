name: Process Scheduled Messages

# Render's free tier has no reliable background worker/cron of its own,
# so this uses GitHub Actions (already free, already in use for CI) as
# the external trigger instead of adding a new paid service. Runs every
# 15 minutes and hits the backend's own processing endpoint, which only
# ever acts on messages a human already scheduled via the app.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Call process-scheduled endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -X POST "https://leadflow-ai-backend-e50r.onrender.com/whatsapp/process-scheduled" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            --max-time 60 \
            || echo "Backend may be cold-starting (Render free tier) — will retry next scheduled run"
